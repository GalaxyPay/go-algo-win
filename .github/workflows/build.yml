name: Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git unzip mingw-w64-ucrt-x86_64-gcc
      - name: CI-Build
        run: |
          echo 'Running in MSYS2!'
          ./ci-build.sh
      - name: Prepare version file
        run: echo $GITHUB_SHA > version
      - name: Checksum
        # FUNC checks node.tar.gz against this before installing it.
        run: sha256sum node.tar.gz | tee node.tar.gz.sha256
      - name: Determine go-algorand tag
        id: algod
        run: |
          TAG=$(git -C go-algorand describe --tags --exact-match)
          echo "Using go-algorand tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.algod.outputs.tag }}
          artifacts: "node.tar.gz,node.tar.gz.sha256"
          immutableCreate: true
